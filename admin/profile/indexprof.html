<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки аккаунта | FG Admin</title>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --panel-bg: #13131a;
            --border-color: rgba(255, 255, 255, 0.05);
            --accent-color: #9333ea;
            --text-main: #ffffff;
            --text-muted: #9494a3;
        }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); }
        .header-admin { height: 60px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; letter-spacing: 2px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
        .main-layout { display: flex; padding-top: 60px; min-height: calc(100vh - 60px); }
        .sidebar { width: 260px; background: var(--panel-bg); border-right: 1px solid var(--border-color); padding: 24px 16px; position: fixed; top: 60px; bottom: 0; left: 0; box-sizing: border-box; }
        .menu-btn { width: 100%; padding: 14px 20px; background: transparent; border: none; border-radius: 12px; color: var(--text-muted); text-align: left; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 8px; transition: all 0.3s; }
        .menu-btn:hover, .menu-btn.active { background: rgba(147, 51, 234, 0.1); color: var(--accent-color); }
        .content-area { margin-left: 260px; padding: 40px; flex-grow: 1; box-sizing: border-box; }
        .card-view { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 32px; max-width: 500px; }
        .avatar-container { display: flex; align-items: center; gap: 24px; margin-bottom: 24px; }
        .avatar-preview { width: 100px; height: 100px; border-radius: 50%; background: #1c1c24; border: 2px dashed var(--accent-color); object-fit: cover; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 12px 16px; background: #1c1c24; border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); font-size: 16px; box-sizing: border-box; }
        .save-btn { padding: 14px 28px; background: var(--accent-color); border: none; border-radius: 12px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
        .file-label { padding: 10px 16px; background: #1c1c24; border: 1px solid var(--border-color); border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background 0.3s; }
        .file-label:hover { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <header class="header-admin">HEADER FG ADMIN</header>
    
    <div class="main-layout">
        <aside class="sidebar">
            <button class="menu-btn active" onclick="switchProfileTab('avatar')">Пароль</button>
            <button class="menu-btn" onclick="switchProfileTab('avatar')">Аватарка</button>
            <button class="menu-btn" onclick="switchProfileTab('username')">Имя</button>
            <button class="menu-btn" style="margin-top: 40px; color: #ef4444" onclick="location.href='admin/admin.html'">Назад в панель</button>
        </aside>
        
        <main class="content-area">
            <!-- ТАБ АВАТАРКИ -->
            <div id="avatar-section" class="card-view profile-section">
                <h3>Управление аватаром</h3>
                <div class="avatar-container">
                    <img id="avatar-img" class="avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%239494a3' stroke-width='1'><circle cx='12' cy='8' r='4'/><path d='M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2'/></svg>" alt="Avatar">
                    <div>
                        <label class="file-label" for="file-upload">Выбрать файл с ПК</label>
                        <input type="file" id="file-upload" accept="image/*" style="display:none">
                    </div>
                </div>
                <button class="save-btn" onclick="saveAvatar()">Сохранить аватарку</button>
            </div>

            <!-- ТАБ ИМЕНИ -->
            <div id="username-section" class="card-view profile-section" style="display:none">
                <h3>Изменение имени</h3>
                <div class="input-group">
                    <label>Новое имя администратора</label>
                    <input type="text" id="new-name">
                </div>
                <button class="save-btn" onclick="saveName()">Обновить имя</button>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('new-name').value = localStorage.getItem('fg_user') || '';
        const savedAvatar = localStorage.getItem('fg_avatar');
        if (savedAvatar) document.getElementById('avatar-img').src = savedAvatar;

        function switchProfileTab(t) {
            document.querySelectorAll('.profile-section').forEach(s => s.style.display = 'none');
            if(t === 'avatar') document.getElementById('avatar-section').style.display = 'block';
            if(t === 'username') document.getElementById('username-section').style.display = 'block';
        }

        document.getElementById('file-upload').addEventListener('change', function(e) {
            const f = e.target.files[0];
            if (f) {
                const r = new FileReader();
                r.onload = function(ev) { document.getElementById('avatar-img').src = ev.target.result; }
                r.readAsDataURL(f);
            }
        });

        function saveAvatar() {
            localStorage.setItem('fg_avatar', document.getElementById('avatar-img').src);
            alert('Аватар обновлен!');
        }

        function saveName() {
            const n = document.getElementById('new-name').value;
            if(n) { localStorage.setItem('fg_user', n); alert('Имя изменено!'); }
        }
    </script>
</body>
</html>
